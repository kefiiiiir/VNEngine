name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile Python entry points
        run: python -m py_compile setup.py template/playtest.py template/tools/*.py

      - name: Run save-resolve tests
        run: node template/tools/tests/save-resolve.test.js
